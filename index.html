<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orapa Mine — Éditeur de disposition</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #16233b;
      --board: #1e2f4d;
      --grid: #33507e;
      --gold: #e9c46a;
      --ink: #e8eef7;
      --muted: #9fb2cf;
      --line: #26385c;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: linear-gradient(160deg, #0b1220, #131f38);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #root {
      max-width: 1080px;
      margin: 0 auto;
      padding: 20px 14px 60px;
    }

    h1 {
      font-size: 20px;
      text-align: center;
      margin: 4px 0 2px
    }

    h1 .g {
      color: var(--gold)
    }

    .sub {
      text-align: center;
      color: var(--muted);
      font-size: 12.5px;
      margin: 0 0 16px;
      line-height: 1.5
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 12px 0 14px
    }

    .tab {
      padding: 8px 20px;
      font-weight: 600;
      letter-spacing: .6px
    }

    .tab.active {
      background: var(--gold);
      border-color: var(--gold);
      color: #1a1206
    }

    .tab.active:hover {
      background: var(--gold);
      border-color: var(--gold)
    }

    .layout {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      align-items: flex-start
    }

    .boardwrap {
      flex: 1 1 460px;
      min-width: 320px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px
    }

    .side {
      flex: 1 1 300px;
      min-width: 260px;
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px
    }

    .panel h3 {
      margin: 0 0 9px;
      font-size: 13px;
      color: var(--gold);
      letter-spacing: .3px
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      touch-action: none
    }

    button {
      font: inherit;
      cursor: pointer;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: #1d2c48;
      color: var(--ink);
      padding: 7px 10px;
      font-size: 12.5px
    }

    button:hover:not(:disabled) {
      border-color: #4a6699;
      background: #243657
    }

    button:disabled {
      opacity: .4;
      cursor: not-allowed
    }

    .pbtn {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      justify-content: flex-start;
      margin-bottom: 6px
    }

    .sw {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, .3);
      flex: 0 0 auto
    }

    .row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap
    }

    .status {
      font-size: 12.5px;
      padding: 8px 10px;
      border-radius: 9px;
      line-height: 1.4
    }

    .ok {
      background: rgba(22, 163, 74, .15);
      border: 1px solid #16a34a;
      color: #86efac
    }

    .bad {
      background: rgba(220, 38, 38, .15);
      border: 1px solid #dc2626;
      color: #fca5a5
    }

    .muted {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px
    }

    .result {
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap
    }

    .bigsw {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, .35)
    }

    .score {
      display: flex;
      align-items: baseline;
      gap: 9px;
      margin-bottom: 10px
    }

    .score b {
      font-size: 30px;
      line-height: 1;
      color: var(--gold);
      font-variant-numeric: tabular-nums
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 5px 10px
    }

    kbd {
      background: #0d1730;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 0 5px;
      font-size: 11px
    }

    table {
      border-collapse: collapse;
      font-size: 11px;
      width: 100%
    }

    td {
      border: 1px solid var(--line);
      padding: 2px 5px;
      text-align: center
    }

    .tabwrap {
      max-height: 220px;
      overflow: auto
    }

    .txt {
      font: inherit;
      font-size: 12.5px;
      flex: 1 1 120px;
      min-width: 120px;
      padding: 7px 9px;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: #0d1730;
      color: var(--ink)
    }

    .arch td {
      text-align: left;
      padding: 5px 7px;
      font-size: 12px
    }

    .arch button {
      padding: 3px 7px;
      font-size: 11.5px;
      white-space: nowrap
    }

    .arch .row {
      gap: 4px;
      flex-wrap: nowrap;
      justify-content: flex-end
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback } = React;

    // ---------- Simulator (port of validated Python) ----------
    const CANON = {
      jaune: [[0, 0], [2, 0], [0, 2]],
      bleu: [[0, 2], [4, 2], [2, 0]],
      grandblanc: [[0, 2], [4, 2], [2, 0]],
      rouge: [[1, 0], [3, 0], [2, 1], [0, 1]],
      petitblanc: [[1, 0], [2, 1], [1, 2], [0, 1]],
    };
    const MAT = { rouge: 'red', jaune: 'yellow', bleu: 'blue', grandblanc: 'white', petitblanc: 'white' };
    const META = {
      rouge: { label: 'Rouge', fill: '#dc2626', stroke: 'rgba(255,255,255,.55)' },
      jaune: { label: 'Jaune', fill: '#eab308', stroke: 'rgba(255,255,255,.55)' },
      bleu: { label: 'Bleu', fill: '#2563eb', stroke: 'rgba(255,255,255,.55)' },
      grandblanc: { label: 'Grand blanc', fill: '#eef2f9', stroke: '#334155' },
      petitblanc: { label: 'Petit blanc', fill: '#eef2f9', stroke: '#334155' },
    };
    const ORDER = ['rouge', 'jaune', 'bleu', 'grandblanc', 'petitblanc'];
    function transform(poly, rot, flip) {
      let pts = poly.map(([x, y]) => [x, y]);
      if (flip) pts = pts.map(([x, y]) => [-x, y]);
      for (let k = 0; k < ((rot % 4) + 4) % 4; k++)pts = pts.map(([x, y]) => [-y, x]);
      const minx = Math.min(...pts.map(p => p[0])), miny = Math.min(...pts.map(p => p[1]));
      return pts.map(([x, y]) => [x - minx, y - miny]);
    }
    function placedPoly(pc) { const t = transform(CANON[pc.name], pc.rot, pc.flip); return t.map(([x, y]) => [x + pc.anchor[0], y + pc.anchor[1]]); }
    function pointInPoly(px, py, poly) {
      let inside = false, n = poly.length, j = n - 1;
      for (let i = 0; i < n; i++) {
        const [xi, yi] = poly[i], [xj, yj] = poly[j];
        if ((yi > py) !== (yj > py)) { const xint = (xj - xi) * (py - yi) / (yj - yi) + xi; if (px < xint) inside = !inside; } j = i;
      } return inside;
    }
    function rasterize(poly) {
      const faces = {}; const n = poly.length;
      for (let i = 0; i < n; i++) {
        const [x1, y1] = poly[i], [x2, y2] = poly[(i + 1) % n];
        const dx = x2 - x1, dy = y2 - y1;
        if (dx !== 0 && dy !== 0) {
          const sx = Math.sign(dx), sy = Math.sign(dy), steps = Math.abs(dx);
          for (let s = 0; s < steps; s++) {
            const ax = x1 + s * sx, ay = y1 + s * sy, bx = ax + sx, by = ay + sy;
            const cx = Math.min(ax, bx), cy = Math.min(ay, by);
            const isTLBR = (ax === cx && ay === cy && bx === cx + 1 && by === cy + 1) || (ax === cx + 1 && ay === cy + 1 && bx === cx && by === cy);
            faces[cx + ',' + cy] = isTLBR ? '\\' : '/';
          }
        }
      }
      const xs = poly.map(p => p[0]), ys = poly.map(p => p[1]);
      const solids = [];
      for (let cx = Math.min(...xs); cx < Math.max(...xs); cx++)for (let cy = Math.min(...ys); cy < Math.max(...ys); cy++) {
        if (faces[cx + ',' + cy]) continue; if (pointInPoly(cx + 0.5, cy + 0.5, poly)) solids.push(cx + ',' + cy);
      }
      return { faces, solids };
    }
    function buildBoard(pieces) {
      const faces = {}, solid = new Map(), mat = [], polys = [], cellsOf = [];
      pieces.forEach((pc, idx) => {
        const poly = placedPoly(pc); polys.push(poly); mat.push(MAT[pc.name]);
        const { faces: f, solids: s } = rasterize(poly); const cells = new Set();
        for (const k in f) { faces[k] = [f[k], idx]; cells.add(k); }
        s.forEach(k => { solid.set(k, idx); cells.add(k); }); cellsOf.push(cells);
      });
      return { faces, solid, mat, polys, cellsOf };
    }
    function legalCheck(pieces) {
      const polys = pieces.map(placedPoly);
      for (const poly of polys) for (const [x, y] of poly) if (x < 0 || x > 10 || y < 0 || y > 8) return { ok: false, msg: 'Une pièce sort du plateau.' };
      const owner = {};
      const board = buildBoard(pieces);
      board.cellsOf.forEach((cells, idx) => { for (const c of cells) { if (owner[c] !== undefined && owner[c] !== idx) return; owner[c] = idx; } });
      // overlap
      const seen = {};
      for (let idx = 0; idx < board.cellsOf.length; idx++)for (const c of board.cellsOf[idx]) { if (seen[c] !== undefined) return { ok: false, msg: 'Deux pièces se chevauchent.' }; seen[c] = idx; }
      // edge adjacency
      for (const c in seen) {
        const [cx, cy] = c.split(',').map(Number);
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nk = (cx + dx) + ',' + (cy + dy); if (seen[nk] !== undefined && seen[nk] !== seen[c]) return { ok: false, msg: 'Deux pièces se touchent par une arête (interdit — seuls les coins peuvent se toucher).' }; }
      }
      return { ok: true, msg: 'Placement valide.' };
    }
    const REFL = { '\\': { R: 'D', D: 'R', L: 'U', U: 'L' }, '/': { R: 'U', U: 'R', L: 'D', D: 'L' } };
    const REV = { R: 'L', L: 'R', U: 'D', D: 'U' };
    const DIRV = { R: [1, 0], L: [-1, 0], U: [0, -1], D: [0, 1] };
    const MIX = { 'red': 'rouge', 'yellow': 'jaune', 'blue': 'bleu', 'white': 'blanc', 'red+yellow': 'orange', 'blue+red': 'violet', 'blue+yellow': 'vert', 'blue+red+yellow': 'noir', 'red+white': 'rose', 'white+yellow': 'citron', 'blue+white': 'bleu ciel', 'blue+red+white+yellow': 'gris', 'blue+white+yellow': 'vert clair', 'blue+red+white': 'violet clair', 'red+white+yellow': 'orange clair' };
    function mixname(cs) { if (cs.length === 0) return 'transparent'; const key = [...new Set(cs)].sort().join('+'); return MIX[key] || cs.join('+'); }
    function fire2(board, side, line, maxsteps = 300) {
      let cx, cy, d;
      if (side === 'L') { cx = 0; cy = line - 1; d = 'R'; } else if (side === 'R') { cx = 9; cy = line - 1; d = 'L'; }
      else if (side === 'T') { cx = line - 1; cy = 0; d = 'D'; } else { cx = line - 1; cy = 7; d = 'U'; }
      const entry = { L: [0, cy + 0.5], R: [10, cy + 0.5], T: [cx + 0.5, 0], B: [cx + 0.5, 8] }[side];
      let path = [entry], colors = [], seg = [];
      for (let step = 0; step < maxsteps; step++) {
        const key = cx + ',' + cy;
        if (board.faces[key]) {
          seg.push(mixname(colors)); const [orient, idx] = board.faces[key]; const c = board.mat[idx];
          if (!colors.includes(c)) colors.push(c); d = REFL[orient][d]; path.push([cx + 0.5, cy + 0.5]);
        }
        else if (board.solid.has(key)) {
          // base plate : demi-tour à 180°, le rayon prend la couleur de la pièce
          seg.push(mixname(colors)); const c = board.mat[board.solid.get(key)];
          if (!colors.includes(c)) colors.push(c); d = REV[d]; path.push([cx + 0.5, cy + 0.5]);
        }
        const [dx, dy] = DIRV[d]; const ncx = cx + dx, ncy = cy + dy;
        if (!(ncx >= 0 && ncx <= 9 && ncy >= 0 && ncy <= 7)) {
          const exitpt = { R: [10, cy + 0.5], L: [0, cy + 0.5], D: [cx + 0.5, 8], U: [cx + 0.5, 0] }[d];
          seg.push(mixname(colors)); path.push(exitpt);
          const exs = { R: ['R', cy + 1], L: ['L', cy + 1], D: ['B', cx + 1], U: ['T', cx + 1] }[d];
          return { ex: exs, col: mixname(colors), path, colors, seg };
        }
        cx = ncx; cy = ncy;
      }
      return { ex: ['LOOP', 0], col: mixname(colors), path, colors, seg };
    }
    window.__sim = { buildBoard, fire2, legalCheck, placedPoly };

    // ---------- Rendering constants ----------
    const CELL = 42, OX = 50, OY = 48, COLS = 10, ROWS = 8;
    const W = OX * 2 + COLS * CELL, H = OY + ROWS * CELL + 52;
    const PX = (x, y) => [OX + x * CELL, OY + y * CELL];
    const LEFT = "ABCDEFGH", BOT = "IJKLMNOPQR";
    const HEX = { 'transparent': '#9aa7bd', 'rouge': '#dc2626', 'jaune': '#eab308', 'bleu': '#2563eb', 'blanc': '#f1f5f9', 'orange': '#f97316', 'violet': '#7c3aed', 'vert': '#16a34a', 'noir': '#0b1220', 'gris': '#64748b', 'rose': '#f472b6', 'citron': '#fde047', 'bleu ciel': '#7dd3fc', 'vert clair': '#86efac', 'violet clair': '#c4b5fd', 'orange clair': '#fdba74' };
    const FR = { red: 'rouge', yellow: 'jaune', blue: 'bleu', white: 'blanc' };
    const entLabel = (side, line) => side === 'L' ? LEFT[line - 1] : side === 'R' ? String(10 + line) : side === 'T' ? String(line) : BOT[line - 1];
    const exLabel = (ex) => { const [s, i] = ex; if (s === 'L') return LEFT[i - 1]; if (s === 'R') return String(10 + i); if (s === 'T') return 'haut ' + i; if (s === 'B') return 'bas ' + BOT[i - 1]; if (s === 'LOOP') return 'rayon piégé'; return '—'; };

    const DEFAULT_ANCHOR = { rouge: [0, 0], jaune: [8, 0], bleu: [0, 5], grandblanc: [5, 5], petitblanc: [4, 3] };

    // ---------- Debug JSON ----------
    function probeJSON(board, side, line) {
      const b = fire2(board, side, line);
      return {
        entree: entLabel(side, line), side, line,
        sortie: exLabel(b.ex), ex: b.ex,
        couleur: b.col,
        touche: b.colors.map(c => FR[c] || c),
        path: b.path.map(([x, y]) => [+x.toFixed(2), +y.toFixed(2)]),
        seg: b.seg,
      };
    }
    function allProbesJSON(board) {
      const out = [];
      for (let r = 1; r <= ROWS; r++) for (const s of ['L', 'R']) out.push(probeJSON(board, s, r));
      for (let c = 1; c <= COLS; c++) for (const s of ['T', 'B']) out.push(probeJSON(board, s, c));
      return out;
    }
    function snapshotJSON(pieces) {
      const board = buildBoard(pieces);
      const faces = {}, solid = {};
      for (const k in board.faces) { const [orient, idx] = board.faces[k]; faces[k] = { orient, piece: pieces[idx].name }; }
      for (const [k, idx] of board.solid) solid[k] = pieces[idx].name;
      return {
        cols: COLS, rows: ROWS,
        pieces: pieces.map(p => ({ name: p.name, anchor: p.anchor, rot: p.rot, flip: p.flip, poly: placedPoly(p) })),
        legal: legalCheck(pieces),
        board: { faces, solid },
        sondages: allProbesJSON(board),
      };
    }

    // ---------- Solo : génération d'une disposition et comparaison ----------
    function shuffled(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    }
    function randomLayout() {
      for (let attempt = 0; attempt < 30; attempt++) {
        const placed = [];
        for (const name of ORDER) {
          const cands = [];
          for (let rot = 0; rot < 4; rot++) for (const flip of [false, true])
            for (let x = 0; x <= COLS; x++) for (let y = 0; y <= ROWS; y++) cands.push({ name, anchor: [x, y], rot, flip });
          const hit = shuffled(cands).find(c => legalCheck([...placed, c]).ok);
          if (!hit) break;
          placed.push(hit);
        }
        if (placed.length === ORDER.length) return placed;
      }
      return ORDER.map(name => ({ name, anchor: DEFAULT_ANCHOR[name].slice(), rot: 0, flip: false }));
    }
    function probeResults(pieces) {
      const board = buildBoard(pieces);
      return allProbesJSON(board).map(p => p.entree + '>' + p.sortie + ':' + p.couleur);
    }

    // ---------- API (serveur Node + SQLite) ----------
    async function apiReq(method, path, body) {
      let res;
      try {
        res = await fetch('/api' + path, {
          method,
          headers: body ? { 'content-type': 'application/json' } : undefined,
          body: body ? JSON.stringify(body) : undefined,
        });
      } catch (e) { throw new Error('serveur injoignable — lance `npm start` puis ouvre http://localhost:3000'); }
      if (!res.ok) { const j = await res.json().catch(() => ({})); throw new Error(j.error || `erreur ${res.status}`); }
      return res.status === 204 ? null : res.json();
    }
    const api = {
      layouts: (source) => apiReq('GET', '/layouts' + (source ? '?source=' + source : '')),
      saveLayout: (l) => apiReq('POST', '/layouts', l),
      delLayout: (id) => apiReq('DELETE', '/layouts/' + id),
      games: () => apiReq('GET', '/games'),
      saveGame: (g) => apiReq('POST', '/games', g),
      delGame: (id) => apiReq('DELETE', '/games/' + id),
    };
    const sig = (pieces) => probeResults(pieces).join('|');
    const dateFR = (iso) => new Date(iso).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' });

    // ---------- Édition de pièces (partagée par les deux modes) ----------
    function useEditor(active) {
      const [pieces, setPieces] = useState([]);
      const [sel, setSel] = useState(null);
      const update = (i, patch) => setPieces(ps => ps.map((p, k) => k === i ? { ...p, ...patch } : p));
      const addPiece = (name) => {
        if (pieces.some(p => p.name === name)) return;
        setPieces([...pieces, { name, anchor: DEFAULT_ANCHOR[name].slice(), rot: 0, flip: false }]);
        setSel(pieces.length);
      };
      const del = (i) => { setPieces(ps => ps.filter((_, k) => k !== i)); setSel(null); };
      const rotate = (i) => update(i, { rot: (pieces[i].rot + 1) % 4 });
      const flip = (i) => update(i, { flip: !pieces[i].flip });
      const clear = () => { setPieces([]); setSel(null); };

      useEffect(() => {
        if (!active) return;
        const h = (e) => {
          const t = e.target;   // ne pas piloter les pièces pendant une saisie
          if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
          if (sel == null) return; const p = pieces[sel]; if (!p) return;
          const move = (dx, dy) => update(sel, { anchor: [p.anchor[0] + dx, p.anchor[1] + dy] });
          if (e.key === 'r' || e.key === 'R') rotate(sel);
          else if (e.key === 'f' || e.key === 'F') flip(sel);
          else if (e.key === 'Delete' || e.key === 'Backspace') del(sel);
          else if (e.key === 'ArrowLeft') move(-1, 0);
          else if (e.key === 'ArrowRight') move(1, 0);
          else if (e.key === 'ArrowUp') move(0, -1);
          else if (e.key === 'ArrowDown') move(0, 1);
          else return;
          e.preventDefault();
        };
        window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h);
      }, [active, sel, pieces]);

      return { pieces, setPieces, sel, setSel, update, addPiece, del, rotate, flip, clear };
    }

    // ---------- Plateau ----------
    function BoardView({ pieces, sel, onSelect, onMovePiece, beam, probe, onMarker, markerFill, ghost }) {
      const svgRef = useRef(null);
      const drag = useRef(null);

      const toBoard = (e) => {
        const svg = svgRef.current; const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
        const p = pt.matrixTransform(svg.getScreenCTM().inverse()); return [(p.x - OX) / CELL, (p.y - OY) / CELL];
      };
      const onDown = (i, e) => {
        e.stopPropagation(); onSelect(i);
        const [bx, by] = toBoard(e); drag.current = { i, startAnchor: pieces[i].anchor.slice(), startMouse: [bx, by] };
        e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId);
      };
      const onMove = (e) => {
        if (!drag.current) return; const [bx, by] = toBoard(e); const { i, startAnchor, startMouse } = drag.current;
        const dx = Math.round(bx - startMouse[0]), dy = Math.round(by - startMouse[1]);
        onMovePiece(i, [startAnchor[0] + dx, startAnchor[1] + dy]);
      };
      const onUp = () => { drag.current = null; };

      const markers = [];
      for (let r = 1; r <= ROWS; r++) { markers.push(['L', r], ['R', r]); }
      for (let c = 1; c <= COLS; c++) { markers.push(['T', c], ['B', c]); }
      const markerPos = (side, line) => {
        if (side === 'L') return PX(0, line - 0.5); if (side === 'R') return PX(10, line - 0.5);
        if (side === 'T') return PX(line - 0.5, 0); return PX(line - 0.5, 8);
      };
      const markerOff = (side) => side === 'L' ? [-15, 0] : side === 'R' ? [15, 0] : side === 'T' ? [0, -15] : [0, 15];

      return (
        <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} onPointerMove={onMove} onPointerUp={onUp} onPointerLeave={onUp}
          onPointerDown={() => onSelect(null)}>
          <rect x={OX - 14} y={OY - 14} width={COLS * CELL + 28} height={ROWS * CELL + 28} rx="12" fill="#1e2f4d" stroke="#3b5580" strokeWidth="2" />
          {Array.from({ length: COLS + 1 }, (_, x) => <line key={'v' + x} x1={PX(x, 0)[0]} y1={PX(x, 0)[1]} x2={PX(x, ROWS)[0]} y2={PX(x, ROWS)[1]} stroke="#33507e" strokeWidth="1" />)}
          {Array.from({ length: ROWS + 1 }, (_, y) => <line key={'h' + y} x1={PX(0, y)[0]} y1={PX(0, y)[1]} x2={PX(COLS, y)[0]} y2={PX(0, y)[1]} stroke="#33507e" strokeWidth="1" />)}
          {Array.from({ length: COLS }, (_, i) => (<g key={'cl' + i}>
            <text x={PX(i + 0.5, 0)[0]} y={OY - 32} textAnchor="middle" fontSize="11" fontFamily="monospace" fill="#9fb2cf">{i + 1}</text>
            <text x={PX(i + 0.5, 0)[0]} y={OY + ROWS * CELL + 36} textAnchor="middle" fontSize="11" fontFamily="monospace" fill="#9fb2cf">{BOT[i]}</text></g>))}
          {Array.from({ length: ROWS }, (_, i) => (<g key={'rl' + i}>
            <text x={OX - 34} y={PX(0, i + 0.5)[1] + 4} textAnchor="middle" fontSize="11" fontFamily="monospace" fill="#9fb2cf">{LEFT[i]}</text>
            <text x={OX + COLS * CELL + 34} y={PX(0, i + 0.5)[1] + 4} textAnchor="middle" fontSize="11" fontFamily="monospace" fill="#9fb2cf">{10 + i + 1}</text></g>))}

          {/* beam */}
          {beam && beam.path.map((pt, i) => {
            if (i === beam.path.length - 1) return null; const a = PX(...pt), b = PX(...beam.path[i + 1]);
            const col = HEX[beam.seg[i]] || '#9aa7bd'; const dash = beam.seg[i] === 'transparent';
            return <line key={'bm' + i} x1={a[0]} y1={a[1]} x2={b[0]} y2={b[1]} stroke={col} strokeWidth="4" strokeLinecap="round" strokeDasharray={dash ? '5 5' : '0'} opacity="0.95" />;
          })}
          {beam && beam.path.slice(1, -1).map((pt, i) => { const a = PX(...pt); return <circle key={'bt' + i} cx={a[0]} cy={a[1]} r="3" fill="#fff" opacity="0.9" />; })}

          {/* solution révélée */}
          {ghost && ghost.map((pc, i) => {
            const pts = placedPoly(pc).map(([x, y]) => PX(x, y).join(',')).join(' '); const m = META[pc.name];
            return <polygon key={'gh' + i} points={pts} fill={m.fill} fillOpacity="0.22" stroke={m.fill} strokeWidth="2"
              strokeDasharray="7 4" strokeLinejoin="round" style={{ pointerEvents: 'none' }} />;
          })}

          {/* pièces */}
          {pieces.map((pc, i) => {
            const poly = placedPoly(pc); const pts = poly.map(([x, y]) => PX(x, y).join(',')).join(' ');
            const m = META[pc.name]; const selc = i === sel;
            return <polygon key={'pc' + i} points={pts} fill={m.fill} fillOpacity="0.96"
              stroke={selc ? '#e9c46a' : m.stroke} strokeWidth={selc ? 3 : 1.5} strokeLinejoin="round"
              style={{ cursor: 'grab' }} onPointerDown={(e) => onDown(i, e)} />;
          })}

          {/* points de tir */}
          {markers.map(([side, line], i) => {
            const [mx, my] = markerPos(side, line); const [ox, oy] = markerOff(side);
            const active = probe && probe.side === side && probe.line === line;
            const fill = active ? '#e9c46a' : (markerFill && markerFill(side, line)) || '#0d1730';
            return <circle key={'mk' + i} cx={mx + ox} cy={my + oy} r="7" fill={fill} stroke="#4a6699" strokeWidth="1.3"
              style={{ cursor: 'pointer' }} onPointerDown={(e) => { e.stopPropagation(); onMarker(side, line); }}>
              <title>{`Tirer depuis ${entLabel(side, line)}`}</title></circle>;
          })}

          {/* point de sortie */}
          {beam && beam.ex[0] !== 'LOOP' && (() => {
            const e = PX(...beam.path[beam.path.length - 1]);
            return <circle cx={e[0]} cy={e[1]} r="7" fill={HEX[beam.col] || '#fff'} stroke="#0b1220" strokeWidth="1.6" />;
          })()}
        </svg>
      );
    }

    // ---------- Panneaux partagés ----------
    function PiecesPanel({ ed, title }) {
      return (<>
        <div className="panel">
          <h3>{title}</h3>
          {ORDER.map(name => {
            const placed = ed.pieces.some(p => p.name === name); const m = META[name];
            return <button key={name} className="pbtn" disabled={placed} onClick={() => ed.addPiece(name)}>
              <span className="sw" style={{ background: m.fill }}></span>
              {placed ? `${m.label} — placée` : `＋ Ajouter ${m.label}`}</button>;
          })}
          <div className="row" style={{ marginTop: 4 }}>
            <button onClick={ed.clear}>↺ Tout effacer</button>
          </div>
        </div>

        {ed.sel != null && ed.pieces[ed.sel] && (
          <div className="panel">
            <h3>Pièce sélectionnée : {META[ed.pieces[ed.sel].name].label}</h3>
            <div className="row">
              <button onClick={() => ed.rotate(ed.sel)}>⟳ Pivoter (R)</button>
              <button onClick={() => ed.flip(ed.sel)}>⇋ Retourner (F)</button>
              <button onClick={() => ed.del(ed.sel)}>🗑 Supprimer</button>
            </div>
            <p className="muted" style={{ marginBottom: 0 }}>Glisse la pièce ou utilise les flèches du clavier pour la déplacer.</p>
          </div>)}
      </>);
    }

    function StatusPanel({ pieces, legal }) {
      return (
        <div className="panel">
          <div className={'status ' + (legal.ok ? 'ok' : 'bad')}>{pieces.length === 0 ? 'Ajoute des pièces pour commencer.' : legal.msg}</div>
          <div className="legend" style={{ marginTop: 10 }}>
            {Object.entries({ rouge: 'Rouge', jaune: 'Jaune', bleu: 'Bleu', blanc: 'Blanc', orange: 'Orange', violet: 'Violet', vert: 'Vert', noir: 'Noir', gris: 'Gris', rose: 'Rose', citron: 'Citron', 'bleu ciel': 'Bleu ciel', 'vert clair': 'Vert clair', 'violet clair': 'Violet clair', 'orange clair': 'Orange clair' }).map(([k, l]) =>
              <span className="chip" key={k}><span className="sw" style={{ width: 12, height: 12, background: HEX[k] }}></span>{l}</span>)}
          </div>
        </div>
      );
    }

    function DebugPanel({ active, pieces, board, probe, hint, children }) {
      const [autoLog, setAutoLog] = useState(true);
      const [copied, setCopied] = useState(false);

      useEffect(() => {
        if (!active) return;
        window.__debug = () => snapshotJSON(pieces);
        window.__debugJSON = () => JSON.stringify(snapshotJSON(pieces), null, 2);
      }, [active, pieces]);
      useEffect(() => {
        if (!active || !autoLog) return;
        console.log('[orapa] plateau', snapshotJSON(pieces));
      }, [active, pieces, autoLog]);
      useEffect(() => {
        if (!active || !autoLog || !probe) return;
        console.log('[orapa] sondage', probeJSON(board, probe.side, probe.line));
      }, [active, probe, pieces, autoLog]);

      const copyJSON = () => {
        navigator.clipboard.writeText(JSON.stringify(snapshotJSON(pieces), null, 2))
          .then(() => { setCopied(true); setTimeout(() => setCopied(false), 1500); })
          .catch(err => console.error('[orapa] copie impossible', err));
      };

      return (
        <div className="panel">
          <h3>Débug</h3>
          <div className="row">
            <button onClick={() => console.log('[orapa] plateau', JSON.stringify(snapshotJSON(pieces), null, 2))}>🐛 Logger le JSON</button>
            <button onClick={copyJSON}>{copied ? '✓ Copié' : '📋 Copier le JSON'}</button>
            {children}
          </div>
          <label className="chip" style={{ marginTop: 8 }}>
            <input type="checkbox" checked={autoLog} onChange={e => setAutoLog(e.target.checked)} />
            Log auto à chaque changement
          </label>
          <p className="muted" style={{ marginBottom: 0 }}>Console : <kbd>__debug()</kbd> (objet) ou <kbd>__debugJSON()</kbd> (texte).{hint}</p>
        </div>
      );
    }

    function SaveLayoutPanel({ pieces }) {
      const [name, setName] = useState('');
      const [msg, setMsg] = useState(null);
      const save = () => {
        setMsg(null);
        api.saveLayout({ name: name.trim() || null, source: 'validation', pieces, signature: sig(pieces) })
          .then(l => { setMsg({ ok: true, txt: `Positionnement enregistré (#${l.id}) — retrouve-le dans ARCHIVES.` }); setName(''); })
          .catch(e => setMsg({ ok: false, txt: e.message }));
      };
      return (
        <div className="panel">
          <h3>Enregistrer</h3>
          <div className="row">
            <input className="txt" placeholder="Nom (optionnel)" value={name} maxLength={80}
              onChange={e => setName(e.target.value)} onKeyDown={e => { if (e.key === 'Enter' && pieces.length) save(); }} />
            <button disabled={!pieces.length} onClick={save}>💾 Enregistrer</button>
          </div>
          {msg && <div className={'status ' + (msg.ok ? 'ok' : 'bad')} style={{ marginTop: 8 }}>{msg.txt}</div>}
        </div>
      );
    }

    // ---------- Mode ARCHIVES (parties et positionnements enregistrés) ----------
    function Archives({ active, onLoad, onPlay }) {
      const [games, setGames] = useState([]);
      const [layouts, setLayouts] = useState([]);
      const [err, setErr] = useState(null);

      const reload = () => Promise.all([api.games(), api.layouts('validation')])
        .then(([g, l]) => { setGames(g); setLayouts(l); setErr(null); })
        .catch(e => setErr(e.message));
      useEffect(() => { if (active) reload(); }, [active]);

      const delGame = (id) => api.delGame(id).then(reload).catch(e => setErr(e.message));
      const delLayout = (id) => api.delLayout(id).then(reload).catch(e => setErr(e.message));

      return (
        <div>
          <p className="sub">Toutes tes parties solo et tes positionnements enregistrés.
            Une ligne se recharge dans l'éditeur, ou se rejoue en solo comme disposition cachée.</p>

          {err && <div className="panel"><div className="status bad">{err}</div></div>}

          <div className="panel" style={{ marginBottom: 12 }}>
            <h3>Parties solo ({games.length})</h3>
            {games.length === 0
              ? <p className="muted" style={{ margin: 0 }}>Aucune partie enregistrée pour l'instant.</p>
              : <table className="arch"><tbody>
                {games.map(g => <tr key={g.id}>
                  <td>{dateFR(g.created_at)}</td>
                  <td><b style={{ color: 'var(--gold)' }}>{g.score}</b> question{g.score > 1 ? 's' : ''}</td>
                  <td>{g.won ? '✓ trouvée' : '— non trouvée'}</td>
                  <td><div className="row">
                    <button onClick={() => onLoad(g.solution)}>📂 Voir la solution</button>
                    <button onClick={() => onPlay(g.solution)}>🎲 Rejouer</button>
                    <button onClick={() => delGame(g.id)}>🗑</button>
                  </div></td>
                </tr>)}
              </tbody></table>}
          </div>

          <div className="panel">
            <h3>Positionnements ({layouts.length})</h3>
            {layouts.length === 0
              ? <p className="muted" style={{ margin: 0 }}>Rien d'enregistré — utilise « 💾 Enregistrer » en mode VALIDATION.</p>
              : <table className="arch"><tbody>
                {layouts.map(l => <tr key={l.id}>
                  <td>{dateFR(l.created_at)}</td>
                  <td>{l.name || <span className="muted">sans nom</span>}</td>
                  <td>{l.pieces.length} pièce{l.pieces.length > 1 ? 's' : ''}</td>
                  <td><div className="row">
                    <button onClick={() => onLoad(l.pieces)}>📂 Charger</button>
                    <button onClick={() => onPlay(l.pieces)}>🎲 Jouer</button>
                    <button onClick={() => delLayout(l.id)}>🗑</button>
                  </div></td>
                </tr>)}
              </tbody></table>}
          </div>
        </div>
      );
    }

    function ProbeTable({ rows }) {
      return <div className="tabwrap" style={{ marginTop: 8 }}><table><tbody>
        {rows.map((r, i) => <tr key={i}><td>{r[0]}</td><td>→</td><td>{r[1]}</td><td>
          <span className="sw" style={{ width: 11, height: 11, display: 'inline-block', background: HEX[r[2]] || '#334155', verticalAlign: 'middle' }}></span> {r[2]}</td></tr>)}
      </tbody></table></div>;
    }

    // ---------- Mode VALIDATION (éditeur + sondage) ----------
    function Validation({ active, bridge }) {
      const ed = useEditor(active);
      const [probe, setProbe] = useState(null);
      const [showAll, setShowAll] = useState(false);

      useEffect(() => {
        bridge.current.loadValidation = (pieces) => { ed.setPieces(pieces.map(p => ({ ...p }))); ed.setSel(null); setProbe(null); };
      });

      const board = buildBoard(ed.pieces);
      const legal = legalCheck(ed.pieces);
      const beam = probe ? fire2(board, probe.side, probe.line) : null;

      const allRows = [];
      if (showAll) {
        for (let r = 1; r <= ROWS; r++) for (const s of ['L', 'R']) { const b = fire2(board, s, r); allRows.push([entLabel(s, r), exLabel(b.ex), b.col]); }
        for (let c = 1; c <= COLS; c++) for (const s of ['T', 'B']) { const b = fire2(board, s, c); allRows.push([entLabel(s, c), exLabel(b.ex), b.col]); }
      }

      return (
        <div>
          <p className="sub">Ajoute des pièces, déplace-les (glisser ou flèches), pivote (<kbd>R</kbd>) et retourne (<kbd>F</kbd>).
            Clique un point du bord pour tirer une onde et voir sa sortie.</p>
          <div className="layout">
            <div className="boardwrap">
              <BoardView pieces={ed.pieces} sel={ed.sel} beam={beam} probe={probe} ghost={null} markerFill={null}
                onSelect={(i) => { ed.setSel(i); setProbe(null); }}
                onMovePiece={(i, anchor) => ed.update(i, { anchor })}
                onMarker={(side, line) => setProbe({ side, line })} />
            </div>

            <div className="side">
              <PiecesPanel ed={ed} title="Pièces" />

              <div className="panel">
                <h3>Sondage</h3>
                {beam ? (
                  <div className="result">
                    <b>{entLabel(probe.side, probe.line)}</b> →
                    <b>{exLabel(beam.ex)}</b>
                    <span className="bigsw" style={{ background: HEX[beam.col] || '#334155' }}></span>
                    <b style={{ color: '#e9c46a' }}>{beam.col}</b>
                    {beam.colors.length > 0 && <span className="muted">(touche&nbsp;: {beam.colors.map(c => FR[c] || c).join(' + ')})</span>}
                  </div>
                ) : <p className="muted" style={{ margin: 0 }}>Clique un rond sur le bord du plateau pour envoyer une onde.</p>}
                <div className="row" style={{ marginTop: 8 }}>
                  <button onClick={() => setShowAll(s => !s)}>{showAll ? 'Masquer' : 'Voir'} les 36 sondages</button>
                  {probe && <button onClick={() => setProbe(null)}>Effacer le rayon</button>}
                </div>
                {showAll && <ProbeTable rows={allRows} />}
              </div>

              <SaveLayoutPanel pieces={ed.pieces} />
              <StatusPanel pieces={ed.pieces} legal={legal} />
              <DebugPanel active={active} pieces={ed.pieces} board={board} probe={probe} />
            </div>
          </div>
        </div>
      );
    }

    // ---------- Mode SOLO (disposition cachée à deviner) ----------
    function Solo({ active, bridge }) {
      const ed = useEditor(active);
      const [solution, setSolution] = useState(randomLayout);
      const [asked, setAsked] = useState([]);
      const [revealed, setRevealed] = useState(false);
      const [verdict, setVerdict] = useState(null);
      const [saved, setSaved] = useState(null);

      const solBoard = buildBoard(solution);
      const legal = legalCheck(ed.pieces);

      const start = (layout) => { setSolution(layout); setAsked([]); setRevealed(false); setVerdict(null); setSaved(null); ed.clear(); };
      const newGame = () => start(randomLayout());

      useEffect(() => { if (active) window.__solution = () => snapshotJSON(solution); }, [active, solution]);
      useEffect(() => { bridge.current.playSolo = (pieces) => start(pieces.map(p => ({ ...p }))); });

      const saveGame = (won) => {
        setSaved({ pending: true });
        api.saveGame({
          solution, guess: ed.pieces,
          questions: asked.map(q => ({ entree: q.entree, sortie: q.sortie, couleur: q.couleur })),
          score: asked.length, won,
          signature: sig(solution),
          guessSignature: ed.pieces.length ? sig(ed.pieces) : null,
        }).then(g => setSaved({ id: g.id })).catch(e => setSaved({ error: e.message }));
      };

      const ask = (side, line) => {
        if (asked.some(q => q.side === side && q.line === line)) return;
        const b = fire2(solBoard, side, line);
        setAsked([...asked, { side, line, entree: entLabel(side, line), sortie: exLabel(b.ex), ex: b.ex, couleur: b.col }]);
      };

      // un rond répondu prend la couleur du rayon, aux deux extrémités
      const fills = {};
      asked.forEach(q => {
        const c = HEX[q.couleur] || '#9aa7bd';
        fills[q.side + ',' + q.line] = c;
        if (q.ex[0] !== 'LOOP') fills[q.ex[0] + ',' + q.ex[1]] = c;
      });

      const verify = () => {
        if (ed.pieces.length !== ORDER.length) { setVerdict({ ok: false, msg: 'Place les 5 pièces avant de vérifier.' }); return; }
        if (!legal.ok) { setVerdict({ ok: false, msg: legal.msg }); return; }
        const mine = probeResults(ed.pieces), truth = probeResults(solution);
        const diff = mine.filter((r, i) => r !== truth[i]).length;
        setVerdict(diff === 0
          ? { ok: true, msg: `Gagné ! Ta disposition donne les mêmes 36 sondages, en ${asked.length} question${asked.length > 1 ? 's' : ''}.` }
          : { ok: false, msg: `Pas encore : ${diff} sondage${diff > 1 ? 's' : ''} sur 36 diffèrent de la disposition cachée.` });
        if (diff === 0 && !saved) saveGame(true);   // une partie gagnée s'archive toute seule
      };

      return (
        <div>
          <p className="sub">Une disposition est cachée. Clique un rond du bord pour poser une question ;
            la sortie et la couleur du rayon te répondent. Reconstitue la disposition avec tes 5 pièces, puis vérifie.</p>
          <div className="layout">
            <div className="boardwrap">
              <BoardView pieces={ed.pieces} sel={ed.sel} beam={null} probe={null} ghost={revealed ? solution : null}
                markerFill={(s, l) => fills[s + ',' + l]}
                onSelect={ed.setSel}
                onMovePiece={(i, anchor) => ed.update(i, { anchor })}
                onMarker={ask} />
            </div>

            <div className="side">
              <div className="panel">
                <h3>Partie</h3>
                <div className="score">
                  <b>{asked.length}</b>
                  <span className="muted">question{asked.length > 1 ? 's' : ''} posée{asked.length > 1 ? 's' : ''} — moins il y en a, meilleur est le score</span>
                </div>
                <div className="row">
                  <button onClick={newGame}>🎲 Nouvelle partie</button>
                  <button onClick={verify}>✔ Vérifier</button>
                  <button onClick={() => setRevealed(r => !r)}>{revealed ? '🙈 Masquer' : '👁 Révéler'} la solution</button>
                  <button onClick={() => saveGame(verdict ? verdict.ok : false)} disabled={saved && saved.pending}>💾 Enregistrer la partie</button>
                </div>
                {verdict && <div className={'status ' + (verdict.ok ? 'ok' : 'bad')} style={{ marginTop: 8 }}>{verdict.msg}</div>}
                {saved && !saved.pending && <div className={'status ' + (saved.error ? 'bad' : 'ok')} style={{ marginTop: 8 }}>
                  {saved.error || `Partie archivée (#${saved.id}) — retrouve-la dans ARCHIVES.`}</div>}
              </div>

              <div className="panel">
                <h3>Questions posées</h3>
                {asked.length === 0
                  ? <p className="muted" style={{ margin: 0 }}>Clique un rond sur le bord du plateau pour poser ta première question.</p>
                  : <ProbeTable rows={asked.map(q => [q.entree, q.sortie, q.couleur])} />}
              </div>

              <PiecesPanel ed={ed} title="Tes hypothèses" />
              <StatusPanel pieces={ed.pieces} legal={legal} />
              <DebugPanel active={active} pieces={ed.pieces} board={buildBoard(ed.pieces)} probe={null}
                hint={<> <kbd>__solution()</kbd> révèle la disposition cachée.</>}>
                <button onClick={() => console.log('[orapa] solution', JSON.stringify(snapshotJSON(solution), null, 2))}>🕵 Logger la solution</button>
              </DebugPanel>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [mode, setMode] = useState('solo');
      const bridge = useRef({});
      const onLoad = (pieces) => { bridge.current.loadValidation(pieces); setMode('validation'); };
      const onPlay = (pieces) => { bridge.current.playSolo(pieces); setMode('solo'); };
      const tab = (id, label) => <button className={'tab' + (mode === id ? ' active' : '')} onClick={() => setMode(id)}>{label}</button>;
      return (
        <div>
          <h1>ORAPA <span className="g">MINE</span></h1>
          <div className="tabs">{tab('solo', 'SOLO')}{tab('validation', 'VALIDATION')}{tab('archives', 'ARCHIVES')}</div>
          <div style={{ display: mode === 'solo' ? 'block' : 'none' }}><Solo active={mode === 'solo'} bridge={bridge} /></div>
          <div style={{ display: mode === 'validation' ? 'block' : 'none' }}><Validation active={mode === 'validation'} bridge={bridge} /></div>
          <div style={{ display: mode === 'archives' ? 'block' : 'none' }}><Archives active={mode === 'archives'} onLoad={onLoad} onPlay={onPlay} /></div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
